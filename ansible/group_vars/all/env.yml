---
# Environment-specific values loaded from the repository root .env file.
# Run `source scripts/env.sh` from the repository root before invoking Ansible.

admin_user: "{{ lookup('ansible.builtin.env', 'HOMELAB_USER') }}"
timezone: "{{ lookup('ansible.builtin.env', 'HOMELAB_TIMEZONE') | default('UTC', true) }}"
lan_cidr: "{{ lookup('ansible.builtin.env', 'HOMELAB_LAN_CIDR') }}"

proxmox_host: "{{ lookup('ansible.builtin.env', 'PROXMOX_HOST') }}"
proxmox_ssh_key: "{{ lookup('ansible.builtin.env', 'PROXMOX_SSH_KEY') | expanduser }}"

arr_host: "{{ lookup('ansible.builtin.env', 'ARR_HOST') }}"
arr_ssh_key: "{{ lookup('ansible.builtin.env', 'ARR_SSH_KEY') | expanduser }}"

vaultwarden_host: "{{ lookup('ansible.builtin.env', 'VAULTWARDEN_HOST') }}"
vaultwarden_ssh_key: "{{ lookup('ansible.builtin.env', 'VAULTWARDEN_SSH_KEY') | expanduser }}"

nginx_proxy_host: "{{ lookup('ansible.builtin.env', 'NGINX_PROXY_HOST') }}"
nginx_proxy_ssh_key: "{{ lookup('ansible.builtin.env', 'NGINX_PROXY_SSH_KEY') | expanduser }}"

pihole_host: "{{ lookup('ansible.builtin.env', 'PIHOLE_HOST') }}"
pihole_ssh_key: "{{ lookup('ansible.builtin.env', 'PIHOLE_SSH_KEY') | expanduser }}"
