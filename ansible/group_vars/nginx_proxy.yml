common_packages:
  - ca-certificates
  - curl
  - gnupg
  - unattended-upgrades

manage_firewall: true
common_firewall_rules:
  - port: 22
    proto: tcp
    source: "{{ lan_cidr }}"
  - port: 80
    proto: tcp
    source: "{{ lan_cidr }}"
  - port: 443
    proto: tcp
    source: "{{ lan_cidr }}"

sonarr_proxy_domain: sonarr.home.arpa
qbittorrent_proxy_domain: qbittorrent.home.arpa
prowlarr_proxy_domain: prowlarr.home.arpa
