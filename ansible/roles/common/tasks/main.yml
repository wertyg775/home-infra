---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Harden SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
  notify: restart ssh

- name: Enable the host firewall
  when: manage_firewall | bool
  tags: [firewall]
  block:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      when: common_firewall_rules is not defined

    - name: Allow app ports from the LAN only
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        from_ip: "{{ lan_cidr }}"
      loop: "{{ common_app_ports }}"
      when: common_firewall_rules is not defined

    - name: Allow configured inbound traffic
      community.general.ufw:
        rule: allow
        direction: in
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        from_ip: "{{ item.source }}"
      loop: "{{ common_firewall_rules | default([]) }}"
      loop_control:
        label: "{{ item.source }} to {{ item.port }}/{{ item.proto }}"

    - name: Deny other incoming traffic by default
      community.general.ufw:
        policy: deny
        direction: incoming

    - name: Enable ufw
      community.general.ufw:
        state: enabled
