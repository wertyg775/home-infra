---
- name: Configure the media stack proxy sites
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}"
    mode: "0644"
  loop: "{{ media_stack_proxy_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Apply Nginx configuration

- name: Enable the media stack proxy sites
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.name }}"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}"
    state: link
  loop: "{{ media_stack_proxy_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Apply Nginx configuration
