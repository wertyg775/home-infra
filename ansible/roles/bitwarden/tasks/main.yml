---
- name: Check required Bitwarden settings
  ansible.builtin.assert:
    that:
      - bitwarden_domain | trim | length > 0
      - bitwarden_installation_id | trim | length > 0
      - bitwarden_installation_key | trim | length > 0
      - bitwarden_tls_cert_src | trim | length > 0
      - bitwarden_tls_key_src | trim | length > 0
    fail_msg: >-
      Set bitwarden_domain, installation ID and key, and the local TLS
      certificate and key paths before deploying. See ansible/README.md.

- name: Check SMTP settings when an SMTP server is configured
  ansible.builtin.assert:
    that:
      - bitwarden_smtp_port | string | trim | length > 0
      - bitwarden_smtp_reply_to | trim | length > 0
    fail_msg: Set the SMTP port and reply-to address when configuring SMTP.
  when: bitwarden_smtp_host | trim | length > 0

- name: Check Bitwarden ports
  ansible.builtin.assert:
    that:
      - bitwarden_http_port | int >= 1
      - bitwarden_http_port | int <= 65535
      - bitwarden_https_port | int >= 1
      - bitwarden_https_port | int <= 65535
      - bitwarden_http_port | int != bitwarden_https_port | int
    fail_msg: Bitwarden HTTP and HTTPS ports must be distinct valid port numbers.

- name: Reject multiline environment values
  ansible.builtin.assert:
    that:
      - "'\n' not in item"
      - "'\r' not in item"
    fail_msg: Bitwarden environment values must not contain newlines.
  loop:
    - "{{ bitwarden_domain }}"
    - "{{ bitwarden_installation_id }}"
    - "{{ bitwarden_installation_key }}"
    - "{{ bitwarden_smtp_host }}"
    - "{{ bitwarden_smtp_port | string }}"
    - "{{ bitwarden_smtp_username }}"
    - "{{ bitwarden_smtp_password }}"
    - "{{ bitwarden_smtp_reply_to }}"
  no_log: true

- name: Create the Bitwarden stack directory
  ansible.builtin.file:
    path: "{{ bitwarden_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create persistent Bitwarden directories
  ansible.builtin.file:
    path: "{{ bitwarden_stack_dir }}/{{ item }}"
    state: directory
    owner: "{{ bitwarden_uid }}"
    group: "{{ bitwarden_gid }}"
    mode: "0700"
  loop:
    - data
    - logs
    - backups

- name: Install the TLS certificate
  ansible.builtin.copy:
    src: "{{ bitwarden_tls_cert_src }}"
    dest: "{{ bitwarden_stack_dir }}/data/ssl.crt"
    owner: "{{ bitwarden_uid }}"
    group: "{{ bitwarden_gid }}"
    mode: "0600"
  notify: Restart Bitwarden

- name: Install the TLS private key
  ansible.builtin.copy:
    src: "{{ bitwarden_tls_key_src }}"
    dest: "{{ bitwarden_stack_dir }}/data/ssl.key"
    owner: "{{ bitwarden_uid }}"
    group: "{{ bitwarden_gid }}"
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart Bitwarden

- name: Render Bitwarden settings
  ansible.builtin.template:
    src: settings.env.j2
    dest: "{{ bitwarden_stack_dir }}/settings.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Render the Bitwarden Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bitwarden_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Ensure Bitwarden is running
  community.docker.docker_compose_v2:
    project_src: "{{ bitwarden_stack_dir }}"
    project_name: "{{ bitwarden_project_name }}"
    state: present
    pull: "{{ bitwarden_compose_pull }}"
  no_log: true
  when: not ansible_check_mode
