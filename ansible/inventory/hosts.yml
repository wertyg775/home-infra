---
all:
  children:
    proxmox_hosts:
      hosts:
        pve1:
          ansible_host: "{{ proxmox_host }}"
          ansible_user: root
          ansible_ssh_private_key_file: "{{ proxmox_ssh_key }}"
    docker_hosts:
      hosts:
        containers:
          ansible_host: "{{ arr_host }}"
          ansible_user: "{{ admin_user }}"
          ansible_ssh_private_key_file: "{{ arr_ssh_key }}"
    vaultwarden_hosts:
      hosts:
        vaultwarden:
          ansible_host: "{{ vaultwarden_host }}"
          ansible_user: "{{ admin_user }}"
          ansible_ssh_private_key_file: "{{ vaultwarden_ssh_key }}"
    nginx_proxy_bootstrap:
      hosts:
        proxy_bootstrap:
          ansible_host: "{{ proxmox_host }}"
          ansible_user: root
          ansible_ssh_private_key_file: "{{ proxmox_ssh_key }}"
          ansible_connection: community.proxmox.proxmox_pct_remote
          proxmox_vmid: 100
          ansible_become: false
    nginx_proxy:
      hosts:
        proxy:
          ansible_host: "{{ nginx_proxy_host }}"
          ansible_user: "{{ admin_user }}"
          ansible_ssh_private_key_file: "{{ nginx_proxy_ssh_key }}"
    pihole_bootstrap:
      hosts:
        bootstrap:
          ansible_host: "{{ proxmox_host }}"
          ansible_user: root
          ansible_ssh_private_key_file: "{{ proxmox_ssh_key }}"
          ansible_connection: community.proxmox.proxmox_pct_remote
          proxmox_vmid: 104
          ansible_become: false
    pihole_hosts:
      hosts:
        pihole:
          ansible_host: "{{ pihole_host }}"
          ansible_user: "{{ admin_user }}"
          ansible_ssh_private_key_file: "{{ pihole_ssh_key }}"
