---
all:
  children:
    docker_hosts:
      hosts:
        containers:
          ansible_host: 192.0.2.101
          ansible_user: admin
          ansible_ssh_private_key_file: /home/admin/.ssh/container_vm
    bitwarden_hosts:
      hosts:
        bitwarden:
          ansible_host: 192.0.2.102
          ansible_user: admin
          ansible_ssh_private_key_file: /home/admin/.ssh/homelab_guest
    nginx_proxy_bootstrap:
      hosts:
        proxy_bootstrap:
          ansible_host: 192.0.2.2
          ansible_user: root
          ansible_ssh_private_key_file: /home/admin/.ssh/proxmox_node
          ansible_connection: community.proxmox.proxmox_pct_remote
          proxmox_vmid: 100
          ansible_become: false
    nginx_proxy:
        hosts:
          proxy:
            ansible_host: 192.0.2.103
            ansible_user: admin
            ansible_ssh_private_key_file: /home/admin/.ssh/homelab_guest
    pihole_bootstrap:
      hosts:
        bootstrap:
          ansible_host: 192.0.2.2
          ansible_user: root
          ansible_ssh_private_key_file: /home/admin/.ssh/proxmox_node
          ansible_connection: community.proxmox.proxmox_pct_remote
          proxmox_vmid: 104
          ansible_become: false
    pihole_hosts:
      hosts:
        pihole:
          ansible_host: 192.0.2.104
          ansible_user: admin
          ansible_ssh_private_key_file: /home/admin/.ssh/homelab_guest       
