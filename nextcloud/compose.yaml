services:
  db:
    image: "${MARIADB_IMAGE}"
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    environment:
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - /srv/nextcloud-container/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  redis:
    image: "${REDIS_IMAGE}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - backend

  app:
    image: "${NEXTCLOUD_IMAGE}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      APACHE_DISABLE_REWRITE_IP: "1"
      TRUSTED_PROXIES: "172.30.0.1"
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: cloud.home.arpa
      OVERWRITECLIURL: https://cloud.home.arpa
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 10G
      APACHE_BODY_LIMIT: "10737418240"
    volumes:
      - /srv/nextcloud-container/html:/var/www/html
      - /srv/nextcloud-data:/var/www/html/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  cron:
    image: "${NEXTCLOUD_IMAGE}"
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - /srv/nextcloud-container/html:/var/www/html
      - /srv/nextcloud-data:/var/www/html/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
